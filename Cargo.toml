[package]
name = "nirudemo"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "NIRUX demoscene easter egg: realtime demos in the theme colours, and the NIRUX music"
default-run = "nirudemo"

[dependencies]
x11rb = { version = "0.13", features = ["render", "randr"] }
libc = "0.2"
toml = "0.8"
# Keep the lockfile compatible with the declared Rust 1.75 baseline.
indexmap = "=2.7.1"

[profile.release]
opt-level = 3
